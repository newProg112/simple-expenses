<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Simple Books</title>
  <style>
    :root{--text:#1f2933;--muted:#4d4d4d;--line:rgba(0,0,0,.1);--accent:#0077b6;--panel:#f7f9fb}
    *{box-sizing:border-box}
    body{margin:0;display:grid;min-height:100vh;place-items:center;padding:20px;color:var(--text);background:radial-gradient(800px 500px at 20% 10%,rgba(0,119,182,.1),transparent 60%),#fff;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
    main{width:min(100%,620px);padding:clamp(26px,6vw,46px);border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.1)}
    .label{margin:0 0 8px;color:var(--accent);font-size:13px;font-weight:750;text-transform:uppercase;letter-spacing:.05em}
    h1{margin:0 0 10px;font-size:clamp(30px,7vw,44px);letter-spacing:-.04em;line-height:1.1}
    p{margin:0 0 20px;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:10px}
    a{display:inline-flex;padding:10px 14px;border:1px solid var(--line);border-radius:14px;color:var(--text);background:#fff;font-weight:650;text-decoration:none}
    a.primary{border-color:var(--accent);color:#fff;background:var(--accent)}
    a:focus-visible{outline:3px solid rgba(0,119,182,.3);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="label">404 · Page not found</p>
    <h1 id="not-found-title">We couldn’t find that page</h1>
    <p id="not-found-copy">The address may be incorrect or the page may have moved. You can return to the Simple Books homepage or browse the guides.</p>
    <div class="actions">
      <a class="primary" href="/">Go to the homepage</a>
      <a href="/guides">Browse Simple Books guides</a>
    </div>
  </main>
  <script>
    if (window.location.pathname.startsWith("/guides/")) {
      document.getElementById("not-found-title").textContent = "We couldn’t find that guide";
      document.getElementById("not-found-copy").textContent = "The guide address may be incorrect. Browse all Simple Books guides to find the topic you need.";
    }
  </script>
</body>
</html>
